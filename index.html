const pick = () => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && D[q]) return q;
  for (const n of navigator.languages || [navigator.language]) {
    const c = n.replace('-', '_');
    if (D[c]) return c;
    const base = c.split('_')[0];
    if (base === 'pt') return 'pt_BR';
    if (base === 'zh') return /TW|HK|Hant/.test(n) ? 'zh_TW' : 'zh_CN';
    if (base === 'nb' || base === 'nn') return 'no';
    if (base === 'tl') return 'fil';
    if (D[base]) return base;
  }
  return 'en';
};
function show(l) {
  const d = D[l];
  document.documentElement.lang = l.replace('_', '-');
  document.documentElement.dir = d.dir;
  document.title = d.privTitle + ' – AdvertSTOP';
  document.getElementById('title').textContent = d.privTitle;
  document.getElementById('lead').textContent = d.privLead;
  const b = document.getElementById('body'); b.textContent = '';
  for (const k of ['privStore', 'privSync', 'privNet', 'privSponsor', 'privPerm', 'privTips']) { const p = document.createElement('p'); p.textContent = d[k]; b.append(p); }
  document.getElementById('updated').textContent = d.privUpdated.replace('$1', new Date(2026, 10, 16).toLocaleDateString(l.replace('_', '-'), { dateStyle: 'long' }));
  document.getElementById('lang').value = l;
}
document.getElementById('lang').addEventListener('change', e => { show(e.target.value); history.replaceState(null, '', '?lang=' + e.target.value); });
show(pick());
